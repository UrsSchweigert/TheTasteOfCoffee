openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Cupmark API
  version: 0.5.0
  description: >-
    Free-tier API of Cupmark (tasks M0-T2, M1-T8, M1-T4d and M1-T6). No request carries free
    text: every string a client sends is an id from the closed vocabulary in
    contracts/vocabulary, a server-generated id, a digit-only barcode or an
    ISO date. The only text is response-only: the product name and brand the
    server fetched from Open Food Facts, length-limited and marked
    x-free-text-from (ADR 0005). Open Food Facts images are served from the
    server's own stored copy (ADR 0011); the app never contacts Open Food
    Facts. Label photos (M1-T4d, ADR 0016) are uploaded straight to S3 with
    a server-generated presigned POST, then stripped of metadata by the API;
    the presigned form fields are server-generated, pattern-constrained
    strings, not user text. The user is always the subject of the bearer
    token; no path, query or body field names a user. Every route needs the
    token except GET /health (ADR 0007). Paid and aggregate routes are not
    part of this document yet. Rules for this file, including the x-vocabulary
    extensions and both exceptions, are in contracts/README.md.

security:
  - bearerAuth: []

paths:
  /barcodes/{barcode}:
    get:
      operationId: lookupBarcode
      summary: Look up a barcode in the shared bean catalogue.
      parameters:
        - $ref: '#/components/parameters/BarcodePath'
      responses:
        '200':
          description: The barcode is known; the bean it points to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bean'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            Unknown barcode, or its bean was rejected. The app then asks GET
            /barcodes/{barcode}/open_food_facts (docs/05-system-design.md,
            Barcode lookup).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /barcodes/{barcode}/open_food_facts:
    get:
      operationId: lookupOpenFoodFacts
      summary: The Open Food Facts product for a barcode that is not in the catalogue, fetched by the server.
      description: >-
        The server answers from its Open Food Facts cache in the catalogue, so
        each barcode is fetched from Open Food Facts at most once; on a miss
        it fetches the product with its own User-Agent and caches the result,
        a hit or a miss. Each fetch from Open Food Facts counts against the
        caller's daily lookup cap; answers from the cache, 400 and 409 do
        not. The app shows the hit for confirmation; confirming it is POST
        /beans with open_food_facts_confirmed. Nothing is stored in the
        catalogue until then (docs/05-system-design.md, Barcode lookup).
      parameters:
        - $ref: '#/components/parameters/BarcodePath'
      responses:
        '200':
          description: Open Food Facts has the product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFoodFactsProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Open Food Facts has no product for this barcode, or none with a name, brand or front image.
        '409':
          description: The barcode already points to a bean. Use GET /barcodes/{barcode}.
        '429':
          description: Throttled, or the caller's daily lookup cap is used up.
        '503':
          description: The lookup is unavailable (Open Food Facts could not be reached, or the server is not set up for it). Nothing was cached; try again later.

  /beans:
    post:
      operationId: createBean
      summary: Create an unverified catalogue entry from pick lists or a confirmed Open Food Facts hit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeanCreate'
      responses:
        '201':
          description: The new unverified bean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bean'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            The barcode already points to a bean (look it up instead), or
            open_food_facts_confirmed is set but the server holds no Open Food
            Facts hit for the barcode (look it up with GET
            /barcodes/{barcode}/open_food_facts first).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /beans/{bean_id}:
    get:
      operationId: getBean
      summary: Read one catalogue entry.
      parameters:
        - $ref: '#/components/parameters/BeanIdPath'
      responses:
        '200':
          description: The bean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bean'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /beans/{bean_id}/label_photos:
    post:
      operationId: createLabelPhotoUpload
      summary: Start the upload of one label photo for an unverified bean (F1 step 4, ADR 0016).
      description: >-
        Returns a new photo_id and an S3 presigned POST for it. The app sends
        the photo straight to S3 as a multipart/form-data POST to upload.url:
        every entry of upload.fields under its S3 form field name (listed on
        LabelPhotoUploadFields), then the JPEG as the last field, named
        file. The POST policy allows exactly the key
        uploads/<photo_id>.jpg, Content-Type image/jpeg and 1 byte to
        max_bytes (8 MiB), and expires 10 minutes after issue (expires_at).
        JPEG only: the app converts the camera's HEIC to JPEG on the device.
        After the upload, the app calls POST
        /label_photos/{photo_id}/complete; nothing is recorded or queued for
        review before that. Label photos go to the operator's private review
        queue and are never shown to other users; no route returns them to
        anyone. No request body.
      parameters:
        - $ref: '#/components/parameters/BeanIdPath'
      responses:
        '201':
          description: The photo id and the presigned POST for its upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPhotoUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bean does not exist or was rejected.
        '409':
          description: >-
            The bean is already verified, so it takes no label photos, or the
            caller already has 3 label photos for this bean (the server checks
            again on completion).
        '429':
          description: >-
            Throttled. The server may also count new uploads against a daily
            per-caller cap; over that cap it answers 429 as well.

  /catalogue_images/{image_id}:
    get:
      operationId: getCatalogueImage
      summary: The server's stored copy of a catalogue image (ADR 0011).
      description: >-
        When the server caches an Open Food Facts hit, it downloads the front
        image once from Open Food Facts, strips all metadata (D12) and stores
        it in the photo bucket under catalogue/<image_id>.jpg. The image_id
        in OpenFoodFactsProduct names that copy. This route returns its
        bytes, so the app never contacts Open Food Facts. Catalogue images are
        shared catalogue data, readable by every signed-in user and tied to
        no user, so account deletion does not remove them (D10).
      parameters:
        - $ref: '#/components/parameters/ImageIdPath'
      responses:
        '200':
          description: The stored JPEG, metadata stripped.
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No stored catalogue image has this id.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /label_photos/{photo_id}/complete:
    post:
      operationId: completeLabelPhoto
      summary: Check, strip and store an uploaded label photo (ADR 0016).
      description: >-
        Call after the presigned POST from POST /beans/{bean_id}/label_photos
        succeeded. The server reads the upload, accepts only a baseline or
        progressive 8-bit JPEG of at most 8 MiB and at most 4096 pixels on
        each side, strips all metadata (EXIF, XMP, GPS, ICC, IPTC, comments;
        D12) and stores the stripped copy for the operator's private review
        queue. Only then is the photo recorded. Label photos are never shown
        to other users. No request body.
      parameters:
        - $ref: '#/components/parameters/PhotoIdPath'
      responses:
        '204':
          description: The photo was stripped and stored for review.
        '400':
          description: >-
            The photo_id is malformed, or the upload is not an acceptable JPEG
            or is larger than 8 MiB. The photo is rejected for good and
            nothing is recorded: the upload is no longer pending, so a later
            call with this photo_id answers 404. To try again, start a new
            upload.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            The caller has no pending upload with this photo_id (unknown,
            another caller's, or rejected), or nothing was uploaded for it (the
            upload never happened, or the staging copy has expired).
        '409':
          description: >-
            The photo is already completed, the bean is no longer unverified
            (verified or rejected meanwhile), or the caller already has 3 label
            photos for this bean.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /shelf:
    get:
      operationId: listShelfEntries
      summary: List the caller's shelf entries.
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: One page of shelf entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createShelfEntry
      summary: Put a purchase on the caller's shelf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelfEntryInput'
      responses:
        '201':
          description: The new shelf entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bean does not exist or was rejected.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /shelf/{shelf_entry_id}:
    get:
      operationId: getShelfEntry
      parameters:
        - $ref: '#/components/parameters/ShelfEntryIdPath'
      responses:
        '200':
          description: The shelf entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceShelfEntry
      description: >-
        Replaces the shelf entry. bean_id may change only while no brew
        references the entry; otherwise the server answers 409 (D14 in
        docs/07-open-questions.md). To correct the bean, delete the brews or
        add a new shelf entry.
      parameters:
        - $ref: '#/components/parameters/ShelfEntryIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelfEntryInput'
      responses:
        '200':
          description: The updated shelf entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: bean_id would change while brews reference this shelf entry (D14).
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteShelfEntry
      parameters:
        - $ref: '#/components/parameters/ShelfEntryIdPath'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Brews still reference this shelf entry.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /brews:
    get:
      operationId: listBrews
      summary: List the caller's brews, newest first.
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: One page of brews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrewPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createBrew
      summary: Log a brew, optionally with its rating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrewInput'
      responses:
        '201':
          description: The new brew.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brew'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The shelf entry does not exist.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /brews/{brew_id}:
    get:
      operationId: getBrew
      parameters:
        - $ref: '#/components/parameters/BrewIdPath'
      responses:
        '200':
          description: The brew.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brew'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceBrew
      parameters:
        - $ref: '#/components/parameters/BrewIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrewInput'
      responses:
        '200':
          description: The updated brew.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brew'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteBrew
      parameters:
        - $ref: '#/components/parameters/BrewIdPath'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /recipes:
    get:
      operationId: listRecipes
      summary: List the caller's saved recipes.
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: One page of recipes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createRecipe
      summary: Save a parameter set as a recipe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '201':
          description: The new recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /recipes/{recipe_id}:
    get:
      operationId: getRecipe
      parameters:
        - $ref: '#/components/parameters/RecipeIdPath'
      responses:
        '200':
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: replaceRecipe
      parameters:
        - $ref: '#/components/parameters/RecipeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '200':
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteRecipe
      parameters:
        - $ref: '#/components/parameters/RecipeIdPath'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /profile:
    get:
      operationId: getProfile
      summary: Read the caller's profile.
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No profile yet. The app runs onboarding, asks for consent, then sends PUT.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: putProfile
      summary: Create or replace the caller's consent and locale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: The stored profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /health:
    get:
      operationId: getHealth
      summary: Liveness check for the deploy smoke test. Needs no token (ADR 0007).
      description: >-
        The one route without the bearer token. It takes no input and returns
        only the fixed body {"status":"ok"}: no version, environment or other
        data. It is throttled like every other route. The lint allows exactly
        this operation without the token (contracts/README.md, Exceptions).
      security: []
      responses:
        '200':
          description: The API is reachable and routed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /export:
    get:
      operationId: exportData
      summary: Export every item of the caller as CSV.
      description: |-
        All of the caller's items as one CSV file (ADR 0017). Every value is an
        id, a vocabulary id, a number, a boolean, a date or a timestamp, so the
        file holds no free text.

        Format:

        - UTF-8 without a byte order mark, RFC 4180, Content-Type
          `text/csv; charset=utf-8; header=present`.
        - The first row is the header. Every row, the last one included, ends
          with CRLF.
        - Every field is enclosed in double quotes, the header too. No value
          can contain a double quote, comma, CR or LF.
        - One row per item. The column `item_type` says which kind of item a
          row is. Rows come in the order of `item_types` below, and each type
          is sorted by ascending id. The profile row is left out while there
          is no profile. A caller with no items gets the header row only.
        - A field that the row's item type does not have, or that the item
          leaves out, is the empty string `""`.
        - Values are written as in the JSON body of the same resource. Ids and
          vocabulary ids are written as they are. Booleans are `true` or
          `false`. Numbers are written in their shortest decimal form, with no
          exponent and no trailing zeros, for example `7` and `7.5`. Dates are
          `YYYY-MM-DD`, and timestamps are RFC 3339 as stored.
        - A multi-valued field is one column, its ids joined by `;` in the
          stored order. Ids never contain `;`. `flavour_notes` is the only
          such field.
        - Nested objects are flattened to their fields, and each column keeps
          the field's JSON name. These wrapper objects add nothing to the
          name: `values`, `parameters`, `rating` and `consent`. The only
          exceptions are the fields of `scores` and `intensities`, whose
          names are vocabulary ids. They take the object's name as a prefix
          (`scores_acidity`, `intensities_acidity`), because both objects
          have a field `acidity` and a field `body`.
        - The columns are fixed and in this order. The header row is exactly
          this list, and it is the same for every caller and every file. The
          lint checks that this list matches `x-csv-columns` on the response,
          and that it holds exactly one column for every field of the
          exported resources (contracts/README.md, "CSV export").

        item_types: profile,shelf_entry,brew,recipe,label_photo

        columns: item_type,locale,contribute_to_aggregates,shelf_entry_id,vocabulary_version,bean_id,purchase_date,roast_date,bag_size,price_band,brew_id,brewed_at,method,dose_dg,water_g,water_temp_c,water_temp_special,brew_time_s,grind_normalised,water_type,milk,scores_aroma,scores_flavour,scores_aftertaste,scores_acidity,scores_body,scores_sweetness,scores_balance,scores_overall,intensities_acidity,intensities_body,intensities_bitterness,flavour_notes,buy_again,recipe_id,photo_id

        Item types:

        - `profile`: the Profile (GET /profile). There is at most one row.
        - `shelf_entry`: a ShelfEntry, with its values.
        - `brew`: a Brew, with its values, parameters and rating.
        - `recipe`: a Recipe, with its values and parameters.
        - `label_photo`: a label photo that is still linked to the caller
          (D10, ADR 0016). The row holds its photo_id and bean_id only. The
          image bytes are not in the file.

        The columns, the item types that fill each one, and the value
        each one holds:

        | column | item types | value |
        |---|---|---|
        | `item_type` | profile, shelf_entry, brew, recipe, label_photo | one of the item types |
        | `locale` | profile | Locale |
        | `contribute_to_aggregates` | profile | boolean |
        | `shelf_entry_id` | shelf_entry, brew | Id. For a brew, its shelf entry. |
        | `vocabulary_version` | shelf_entry, brew, recipe | VocabularyVersion of the item |
        | `bean_id` | shelf_entry, label_photo | Id |
        | `purchase_date` | shelf_entry | CalendarDate |
        | `roast_date` | shelf_entry | CalendarDate |
        | `bag_size` | shelf_entry | BagSize |
        | `price_band` | shelf_entry | PriceBand |
        | `brew_id` | brew | Id |
        | `brewed_at` | brew | Timestamp |
        | `method` | brew, recipe | Method |
        | `dose_dg` | brew, recipe | DoseDg (integer decigrams) |
        | `water_g` | brew, recipe | WaterG |
        | `water_temp_c` | brew, recipe | WaterTempC |
        | `water_temp_special` | brew, recipe | WaterTempSpecial |
        | `brew_time_s` | brew, recipe | BrewTimeS |
        | `grind_normalised` | brew, recipe | GrindNormalised |
        | `water_type` | brew, recipe | WaterType |
        | `milk` | brew, recipe | MilkType |
        | `scores_aroma` | brew | Score |
        | `scores_flavour` | brew | Score |
        | `scores_aftertaste` | brew | Score |
        | `scores_acidity` | brew | Score |
        | `scores_body` | brew | Score |
        | `scores_sweetness` | brew | Score |
        | `scores_balance` | brew | Score |
        | `scores_overall` | brew | Score |
        | `intensities_acidity` | brew | IntensityLevel |
        | `intensities_body` | brew | IntensityLevel |
        | `intensities_bitterness` | brew | IntensityLevel |
        | `flavour_notes` | brew | FlavourNote ids joined by `;` |
        | `buy_again` | brew | boolean |
        | `recipe_id` | recipe | Id |
        | `photo_id` | label_photo | Id |

        Not exported: the daily lookup counters, the label-photo cap
        counters, pending label photo uploads and any other server state.
        Rate-limit state and unfinished uploads are not the caller's data.
      responses:
        '200':
          description: >-
            All of the caller's items, in the format given in the operation
            description.
          content:
            text/csv:
              schema:
                type: string
                contentMediaType: text/csv
              x-csv-item-types: [profile, shelf_entry, brew, recipe, label_photo]
              x-csv-columns:
                - item_type
                - locale
                - contribute_to_aggregates
                - shelf_entry_id
                - vocabulary_version
                - bean_id
                - purchase_date
                - roast_date
                - bag_size
                - price_band
                - brew_id
                - brewed_at
                - method
                - dose_dg
                - water_g
                - water_temp_c
                - water_temp_special
                - brew_time_s
                - grind_normalised
                - water_type
                - milk
                - scores_aroma
                - scores_flavour
                - scores_aftertaste
                - scores_acidity
                - scores_body
                - scores_sweetness
                - scores_balance
                - scores_overall
                - intensities_acidity
                - intensities_body
                - intensities_bitterness
                - flavour_notes
                - buy_again
                - recipe_id
                - photo_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /account:
    delete:
      operationId: deleteAccount
      summary: Delete the caller's account, every item of the caller and the caller's label photos.
      description: |-
        Deletes the account in the request (D2, D10, D11, ADR 0017). The steps
        run in this order:

        1. Every version of the caller's label photos of beans that are not
           verified yet is deleted at once, both the stored and the uploaded
           copy, along with the catalogue's record of each such photo. Photos
           of verified beans stay in the catalogue but lose their link to the
           caller (D10).
        2. Every item of the caller is deleted: the profile, shelf entries,
           brews, recipes, label photo links, pending uploads and counters.
           The aggregator (M3) subtracts each deleted brew, as it does for
           any deleted brew (D2).
        3. An entry is written to the deletion log. It holds ids only: the
           caller's user id and the ids of the deleted photos. Every restore
           from a backup re-applies the log before the restored data is used
           (D11).
        4. The caller's sign-in account is deleted last. After that, no new
           token can be issued for it.

        The answer is 204 only after every step has succeeded. If any step
        fails, the server answers 500 (as on any route, an unexpected
        failure is not listed in this document), and the app retries. Every
        step can safely be repeated, so a retry with the same token finishes
        the deletion, as long as the token has not expired. A retry after a
        204 answers 204 again. After the 204, the app signs out and discards
        its tokens.
      responses:
        '204':
          description: The account and every item of the caller are deleted, and the deletion is logged.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token. The user id is its subject and is never sent any other way.

  responses:
    BadRequest:
      description: >-
        A field is outside its list or range, an unknown property was sent, the
        vocabulary version is not published, or a barcode is malformed or has a
        bad check digit.
    Unauthorized:
      description: Missing, invalid or expired token.
    NotFound:
      description: >-
        No such item. On the caller's own routes (shelf, brews, recipes) the
        item is not in the caller's partition, or the bean_id a shelf entry
        write names newly is unknown or rejected. On the shared catalogue
        routes (GET /beans/{bean_id}, GET /barcodes/{barcode}) the bean is not
        in the catalogue. A rejected bean counts as not found everywhere.
    TooManyRequests:
      description: Throttled.

  parameters:
    BarcodePath:
      name: barcode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Barcode'
    BeanIdPath:
      name: bean_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PhotoIdPath:
      name: photo_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ImageIdPath:
      name: image_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ShelfEntryIdPath:
      name: shelf_entry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrewIdPath:
      name: brew_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RecipeIdPath:
      name: recipe_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  schemas:
    # ---- Identifiers and plain values ----

    Id:
      description: Server-generated ULID (Crockford base32, upper case).
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    Barcode:
      description: >-
        EAN-13 (13 digits) or UPC-A (12 digits). The server checks the check
        digit and stores the 13-digit form (UPC-A with a leading 0).
      type: string
      pattern: '^[0-9]{12,13}$'

    Cursor:
      description: >-
        Opaque pagination cursor. The server issues cursors HMAC-signed and
        rejects any cursor it did not issue (implemented in M1-T5).
      type: string
      pattern: '^[A-Za-z0-9_-]{1,512}$'

    CalendarDate:
      type: string
      format: date

    Timestamp:
      description: RFC 3339 date and time, recorded on the device (brews are logged offline).
      type: string
      format: date-time

    VocabularyVersion:
      description: Published vocabulary version the values were picked from. Maximum is the latest published version.
      type: integer
      minimum: 1
      maximum: 2
      x-vocabulary-version: true

    HealthStatus:
      description: The fixed body of GET /health, {"status":"ok"} (ADR 0007). Used nowhere else.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          x-health-status: true

    Locale:
      type: string
      enum: [de, en]
      x-i18n-languages: true

    # ---- Vocabulary lists (union of the published versions, contracts/vocabulary/v1 and v2) ----

    Method:
      type: string
      enum: [espresso, moka_pot, v60, chemex, kalita, batch_filter, aeropress, french_press, cold_brew, cezve, siphon, fully_automatic]
      x-vocabulary: methods

    WaterType:
      type: string
      enum: [tap, filtered, bottled, remineralised]
      x-vocabulary: water_types

    MilkType:
      type: string
      enum: [none, dairy, oat, soy, almond, cashew, hazelnut, macadamia, coconut, rice, pea, other_plant]
      x-vocabulary: milk_types

    WaterTempSpecial:
      type: string
      enum: [cold]
      x-vocabulary: water_temp_special

    Process:
      type: string
      enum: [washed, natural, honey, pulped_natural, wet_hulled, anaerobic, carbonic_maceration, other]
      x-vocabulary: processes

    RoastLevel:
      type: string
      enum: [light, medium_light, medium, medium_dark, dark]
      x-vocabulary: roast_levels

    Origin:
      description: >-
        Producing country or region, from vocabulary v2. A region names its
        country in the vocabulary (ADR 0011), so filters can group by country.
      type: string
      enum: [ethiopia, kenya, rwanda, burundi, tanzania, uganda, democratic_republic_of_the_congo, malawi, zambia, zimbabwe, madagascar, cameroon, cote_d_ivoire, togo, yemen, brazil, colombia, peru, ecuador, bolivia, venezuela, guatemala, honduras, el_salvador, nicaragua, costa_rica, panama, mexico, jamaica, dominican_republic, cuba, haiti, puerto_rico, usa, hawaii, india, indonesia, sumatra, java, sulawesi, bali, flores, papua_new_guinea, vietnam, laos, thailand, myanmar, china, timor_leste, philippines, nepal, taiwan, australia, blend, other, unknown]
      x-vocabulary: origins

    Species:
      description: Coffee species, from vocabulary v2 (ADR 0011).
      type: string
      enum: [arabica, robusta, liberica, excelsa, arabica_robusta_blend, unknown]
      x-vocabulary: species

    Variety:
      description: Arabica cultivar, from vocabulary v2 (ADR 0006, ADR 0011).
      type: string
      enum: [typica, bourbon, red_bourbon, yellow_bourbon, pink_bourbon, caturra, catuai, catucai, mundo_novo, pacas, villa_sarchi, maragogipe, pacamara, geisha, java, sl14, sl28, sl34, ruiru_11, batian, castillo, catimor, sarchimor, parainema, obata, marsellesa, heirloom, ethiopia_74110, ethiopia_74112, s795, wush_wush, sidra, laurina, mixed, other, unknown]
      x-vocabulary: varieties

    BagSize:
      type: string
      enum: [g_250, g_500, g_1000]
      x-vocabulary: bag_sizes

    PriceBand:
      type: string
      enum: [under_15, from_15_to_30, from_30_to_45, from_45_to_60, from_60_to_80, from_80]
      x-vocabulary: price_bands

    IntensityLevel:
      type: string
      enum: [low, medium, high]
      x-vocabulary: intensity_levels

    FlavourNote:
      type: string
      enum:
        - berry
        - cherry
        - plum
        - peach
        - apricot
        - apple
        - pear
        - grape
        - lemon
        - lime
        - orange
        - grapefruit
        - mandarin
        - bergamot
        - pineapple
        - mango
        - passion_fruit
        - banana
        - coconut
        - lychee
        - raisin
        - prune
        - date
        - fig
        - jasmine
        - rose
        - lavender
        - orange_blossom
        - elderflower
        - chamomile
        - hibiscus
        - black_tea
        - green_tea
        - mint
        - fresh_herbs
        - grass
        - honey
        - caramel
        - toffee
        - brown_sugar
        - maple_syrup
        - molasses
        - vanilla
        - milk_chocolate
        - dark_chocolate
        - cocoa
        - nougat
        - hazelnut
        - almond
        - walnut
        - peanut
        - pecan
        - marzipan
        - cinnamon
        - clove
        - nutmeg
        - cardamom
        - black_pepper
        - anise
        - ginger
        - liquorice
        - toasted_bread
        - biscuit
        - malt
        - cereal
        - smoke
        - tobacco
        - burnt
        - red_wine
        - white_wine
        - rum
        - whisky
        - overripe_fruit
        - forest_floor
        - wood
        - cedar
        - leather
        - mushroom
        - musty
        - cardboard
        - rubber
      x-vocabulary: flavour_notes

    # ---- Vocabulary ranges ----

    DoseDg:
      description: >-
        Dose in tenths of a gram (decigrams): 50 is 5.0 g, 1000 is 100.0 g.
        Sent as an integer because 0.1 is not exact in binary floating point.
      type: integer
      minimum: 50
      maximum: 1000
      x-vocabulary-range: brew.ranges.dose_g
      x-vocabulary-scale: 10

    WaterG:
      description: Water, or yield for espresso, in grams.
      type: integer
      minimum: 10
      maximum: 1500
      x-vocabulary-range: brew.ranges.water_g

    WaterTempC:
      type: integer
      minimum: 80
      maximum: 100
      x-vocabulary-range: brew.ranges.water_temp_c

    BrewTimeS:
      type: integer
      minimum: 1
      maximum: 172800
      x-vocabulary-range: brew.ranges.brew_time_s

    GrindNormalised:
      description: Normalised coarseness, 1 (finest) to 10, in half steps.
      type: number
      minimum: 1
      maximum: 10
      multipleOf: 0.5
      x-vocabulary-range: brew.ranges.grind_normalised

    Score:
      type: number
      minimum: 1
      maximum: 10
      multipleOf: 0.5
      x-vocabulary-range: criteria.scale

    # ---- Bean catalogue (F1) ----

    BeanAttributes:
      description: >-
        Catalogue attributes picked from the vocabulary. Origin, species and
        variety are in vocabulary v2 (ADR 0006, ADR 0011), so a request that
        sends any of them must say vocabulary_version 2 or later; the server
        rejects them with version 1. Roaster is not a pick list: it comes
        from the Open Food Facts brand and the operator (ADR 0006).
      type: object
      additionalProperties: false
      properties:
        process:
          $ref: '#/components/schemas/Process'
        roast_level:
          $ref: '#/components/schemas/RoastLevel'
        origin:
          $ref: '#/components/schemas/Origin'
        species:
          $ref: '#/components/schemas/Species'
        variety:
          $ref: '#/components/schemas/Variety'

    BeanCreate:
      description: >-
        Creates an unverified bean. Every value in attributes is stored with
        source "user". open_food_facts_confirmed records that the user
        confirmed the Open Food Facts hit for the barcode; it needs the
        barcode. The client never sends Open Food Facts text: the server
        copies name, brand and image id from its own cached lookup
        (ADR 0005), so this body holds only ids, a barcode and a boolean.
      type: object
      additionalProperties: false
      required: [vocabulary_version, attributes]
      properties:
        vocabulary_version:
          $ref: '#/components/schemas/VocabularyVersion'
        barcode:
          $ref: '#/components/schemas/Barcode'
        open_food_facts_confirmed:
          type: boolean
        attributes:
          $ref: '#/components/schemas/BeanAttributes'
      dependentRequired:
        open_food_facts_confirmed: [barcode]

    Bean:
      description: >-
        A catalogue entry. The source of every attribute is the group it is
        in: picked by a user, or set by the operator when verifying. The
        operator's value wins where both exist.
      type: object
      additionalProperties: false
      required: [bean_id, vocabulary_version, verified, open_food_facts_match, picked_attributes, operator_attributes]
      properties:
        bean_id:
          $ref: '#/components/schemas/Id'
        vocabulary_version:
          $ref: '#/components/schemas/VocabularyVersion'
        verified:
          type: boolean
        barcode:
          $ref: '#/components/schemas/Barcode'
        open_food_facts_match:
          description: >-
            True if a user confirmed an Open Food Facts hit for this barcode
            (attribution required, ODbL).
          type: boolean
        open_food_facts:
          $ref: '#/components/schemas/OpenFoodFactsProduct'
        picked_attributes:
          $ref: '#/components/schemas/BeanAttributes'
        operator_attributes:
          $ref: '#/components/schemas/BeanAttributes'

    OpenFoodFactsProduct:
      description: >-
        What the server fetched from Open Food Facts for a barcode (ADR 0005).
        Response-only: no request schema may reach it, which the lint checks.
        The source of every field is Open Food Facts, which is why the group
        has that name (D5, ODbL attribution); the operator's attributes are
        kept apart in operator_attributes. name and brand are untrusted text:
        trimmed and cut to maxLength code points by the server when stored,
        shown as plain text only (never as markup), and never logged. A field
        Open Food Facts does not have is left out.
      type: object
      additionalProperties: false
      properties:
        name:
          description: Open Food Facts product_name, in the language Open Food Facts returned.
          type: string
          minLength: 1
          maxLength: 150
          readOnly: true
          x-free-text-from: open_food_facts
        brand:
          description: The first entry of the Open Food Facts brands field. The operator curates roasters from it (ADR 0006).
          type: string
          minLength: 1
          maxLength: 100
          readOnly: true
          x-free-text-from: open_food_facts
        image_id:
          description: >-
            The server's stored copy of the Open Food Facts front image (ADR
            0011), a server-generated id: fetch the bytes with GET
            /catalogue_images/{image_id}. Left out when there is no stored
            copy. The app never loads images from Open Food Facts.
          $ref: '#/components/schemas/Id'

    # ---- Label photos (F1 step 4, ADR 0016) ----

    LabelPhotoUpload:
      description: >-
        A new label photo upload: its id and the presigned S3 POST for it.
        Every value is generated by the server; none is typed by a user.
      type: object
      additionalProperties: false
      required: [photo_id, upload, expires_at, max_bytes]
      properties:
        photo_id:
          $ref: '#/components/schemas/Id'
        upload:
          $ref: '#/components/schemas/LabelPhotoUploadForm'
        expires_at:
          description: When the presigned POST stops working, 10 minutes after issue.
          $ref: '#/components/schemas/Timestamp'
        max_bytes:
          description: The largest accepted upload, 8 MiB. The POST policy enforces it.
          type: integer
          minimum: 8388608
          maximum: 8388608

    LabelPhotoUploadForm:
      description: >-
        The presigned S3 POST, as the AWS SDK v3 createPresignedPost returns
        it. url is the endpoint of our own photo bucket in eu-central-1 and
        names the same bucket as fields.bucket.
      type: object
      additionalProperties: false
      required: [url, fields]
      properties:
        url:
          description: Virtual-hosted endpoint of the cupmark photo bucket, with a trailing slash.
          type: string
          maxLength: 120
          pattern: '^https://cupmark-[a-z0-9-]{1,55}\.s3\.eu-central-1\.amazonaws\.com/$'
        fields:
          $ref: '#/components/schemas/LabelPhotoUploadFields'

    LabelPhotoUploadFields:
      description: >-
        The form fields of the presigned POST. Property names are snake_case
        here (the generators need that); each property's description names the
        S3 form field it is sent as, exactly as written there (key, bucket,
        Content-Type, Policy, X-Amz-Algorithm, X-Amz-Credential, X-Amz-Date,
        X-Amz-Security-Token, X-Amz-Signature). The backend maps
        createPresignedPost's fields to these names, and the app maps them
        back. Send every field present, in any order, before the file field.
      type: object
      additionalProperties: false
      required: [key, bucket, content_type, policy, x_amz_algorithm, x_amz_credential, x_amz_date, x_amz_signature]
      properties:
        key:
          description: Form field key. The staging key of the photo; it holds the photo id only, no user id (ADR 0016).
          type: string
          maxLength: 38
          pattern: '^uploads/[0-9A-HJKMNP-TV-Z]{26}\.jpg$'
        bucket:
          description: Form field bucket. The photo bucket, the same as in url.
          type: string
          maxLength: 63
          pattern: '^cupmark-[a-z0-9-]{1,55}$'
        content_type:
          description: Form field Content-Type. Always image/jpeg; the policy requires it.
          type: string
          maxLength: 10
          pattern: '^image/jpeg$'
        policy:
          description: Form field Policy. The base64-encoded POST policy.
          type: string
          maxLength: 8192
          pattern: '^[A-Za-z0-9+/=]{1,8192}$'
        x_amz_algorithm:
          description: Form field X-Amz-Algorithm.
          type: string
          maxLength: 16
          pattern: '^AWS4-HMAC-SHA256$'
        x_amz_credential:
          description: Form field X-Amz-Credential. Access key id, date, region, service and terminator.
          type: string
          maxLength: 170
          pattern: '^[A-Z0-9]{16,128}/[0-9]{8}/eu-central-1/s3/aws4_request$'
        x_amz_date:
          description: Form field X-Amz-Date. ISO 8601 basic format, UTC.
          type: string
          maxLength: 16
          pattern: '^[0-9]{8}T[0-9]{6}Z$'
        x_amz_security_token:
          description: >-
            Form field X-Amz-Security-Token. The session token of the API's
            temporary credentials; present whenever the server signs with
            them, as in Lambda.
          type: string
          maxLength: 4096
          pattern: '^[A-Za-z0-9+/=]{1,4096}$'
        x_amz_signature:
          description: Form field X-Amz-Signature. Hex-encoded SigV4 signature.
          type: string
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'

    # ---- Shelf (F1 step 5) ----

    ShelfEntryInput:
      type: object
      additionalProperties: false
      required: [vocabulary_version, bean_id, purchase_date]
      properties:
        vocabulary_version:
          $ref: '#/components/schemas/VocabularyVersion'
        bean_id:
          $ref: '#/components/schemas/Id'
        purchase_date:
          $ref: '#/components/schemas/CalendarDate'
        roast_date:
          $ref: '#/components/schemas/CalendarDate'
        bag_size:
          $ref: '#/components/schemas/BagSize'
        price_band:
          $ref: '#/components/schemas/PriceBand'

    ShelfEntry:
      type: object
      additionalProperties: false
      required: [shelf_entry_id, values]
      properties:
        shelf_entry_id:
          $ref: '#/components/schemas/Id'
        values:
          $ref: '#/components/schemas/ShelfEntryInput'

    ShelfEntryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ShelfEntry'
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    # ---- Brew and rating (F2, F3) ----

    BrewParameters:
      description: >-
        Everything but the method is optional (F2). water_temp_c and
        water_temp_special exclude each other. Which fields apply to which
        method is not defined in vocabulary v1 yet.
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          $ref: '#/components/schemas/Method'
        dose_dg:
          $ref: '#/components/schemas/DoseDg'
        water_g:
          $ref: '#/components/schemas/WaterG'
        water_temp_c:
          $ref: '#/components/schemas/WaterTempC'
        water_temp_special:
          $ref: '#/components/schemas/WaterTempSpecial'
        brew_time_s:
          $ref: '#/components/schemas/BrewTimeS'
        grind_normalised:
          $ref: '#/components/schemas/GrindNormalised'
        water_type:
          $ref: '#/components/schemas/WaterType'
        milk:
          $ref: '#/components/schemas/MilkType'
      not:
        required: [water_temp_c, water_temp_special]

    Scores:
      description: One score per criterion; a rating scores all eight (F3).
      type: object
      additionalProperties: false
      x-vocabulary-keys: criteria
      required: [aroma, flavour, aftertaste, acidity, body, sweetness, balance, overall]
      properties:
        aroma:
          $ref: '#/components/schemas/Score'
        flavour:
          $ref: '#/components/schemas/Score'
        aftertaste:
          $ref: '#/components/schemas/Score'
        acidity:
          $ref: '#/components/schemas/Score'
        body:
          $ref: '#/components/schemas/Score'
        sweetness:
          $ref: '#/components/schemas/Score'
        balance:
          $ref: '#/components/schemas/Score'
        overall:
          $ref: '#/components/schemas/Score'

    Intensities:
      type: object
      additionalProperties: false
      x-vocabulary-keys: intensity_dimensions
      properties:
        acidity:
          $ref: '#/components/schemas/IntensityLevel'
        body:
          $ref: '#/components/schemas/IntensityLevel'
        bitterness:
          $ref: '#/components/schemas/IntensityLevel'

    Rating:
      type: object
      additionalProperties: false
      required: [scores]
      properties:
        scores:
          $ref: '#/components/schemas/Scores'
        intensities:
          $ref: '#/components/schemas/Intensities'
        flavour_notes:
          type: array
          uniqueItems: true
          maxItems: 5
          x-vocabulary-max-items: flavour_notes.max_picks
          items:
            $ref: '#/components/schemas/FlavourNote'
        buy_again:
          type: boolean

    BrewInput:
      type: object
      additionalProperties: false
      required: [vocabulary_version, shelf_entry_id, brewed_at, parameters]
      properties:
        vocabulary_version:
          $ref: '#/components/schemas/VocabularyVersion'
        shelf_entry_id:
          $ref: '#/components/schemas/Id'
        brewed_at:
          $ref: '#/components/schemas/Timestamp'
        parameters:
          $ref: '#/components/schemas/BrewParameters'
        rating:
          $ref: '#/components/schemas/Rating'

    Brew:
      type: object
      additionalProperties: false
      required: [brew_id, values]
      properties:
        brew_id:
          $ref: '#/components/schemas/Id'
        values:
          $ref: '#/components/schemas/BrewInput'

    BrewPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Brew'
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    # ---- Recipe ----

    RecipeInput:
      type: object
      additionalProperties: false
      required: [vocabulary_version, parameters]
      properties:
        vocabulary_version:
          $ref: '#/components/schemas/VocabularyVersion'
        parameters:
          $ref: '#/components/schemas/BrewParameters'

    Recipe:
      type: object
      additionalProperties: false
      required: [recipe_id, values]
      properties:
        recipe_id:
          $ref: '#/components/schemas/Id'
        values:
          $ref: '#/components/schemas/RecipeInput'

    RecipePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Recipe'
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    # ---- Profile ----

    Consent:
      type: object
      additionalProperties: false
      required: [contribute_to_aggregates]
      properties:
        contribute_to_aggregates:
          description: >-
            Opt-in (D1, ADR 0017). Asked once at onboarding; false unless the
            user agrees, so the app sends false until then. The aggregator
            (M3) counts only brews written while this was true.
          type: boolean

    Profile:
      description: Consent and locale. Entitlement is added with the paid tier (M4).
      type: object
      additionalProperties: false
      required: [locale, consent]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        consent:
          $ref: '#/components/schemas/Consent'
