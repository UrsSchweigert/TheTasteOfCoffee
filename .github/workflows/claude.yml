# Lets you drive the agent team from GitHub: mention @claude in an issue or
# pull request comment, for example "@claude /next-task" or "@claude /status".
#
# Setup (once): install the Claude GitHub App on this repository, run
# `claude setup-token` locally and save the result as the repository secret
# CLAUDE_CODE_OAUTH_TOKEN. Runs then draw on your Claude subscription's usage
# allowance. To bill an API key instead, replace the token line with:
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Each run is capped by --max-turns and the job timeout below.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 80"
