# Lets you drive the agent team from GitHub: mention @claude in an issue or
# pull request comment, for example "@claude /next-task" or "@claude /status".
#
# Setup (once): install the Claude GitHub App on this repository and add the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (Claude subscription). If you use an
# API key instead, add ANTHROPIC_API_KEY and replace the claude_code_oauth_token
# line with:
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
