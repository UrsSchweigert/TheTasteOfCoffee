# Lets you drive the agent team from GitHub: mention @claude in an issue or
# pull request comment, for example "@claude /next-task" or "@claude /status".
#
# Setup (once): install the Claude GitHub App on this repository and add the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (Claude subscription). If you use an
# API key instead, add ANTHROPIC_API_KEY and replace the claude_code_oauth_token
# line with:
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Safety rules, enforced by scripts/check-workflows.mjs (strict file):
# - actions pinned to a commit SHA with the version in a trailing comment;
#   Dependabot (.github/dependabot.yml) proposes updates;
# - no token scopes at the top level; the job grants only what it uses (below);
# - checkout without persisted credentials. The action does not need them: it
#   removes checkout's credential itself and points origin at the Claude App
#   token (src/github/operations/git-config.ts at the pinned commit). The action
#   runs one `git fetch` before it installs that token, which works only while
#   this repository is public. If it ever goes private, that fetch fails: set
#   persist-credentials back to true here and add a documented exception.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions: {}
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The action gets its GitHub credentials by exchanging a GitHub OIDC token
    # for a Claude GitHub App installation token, and does every push, comment
    # and pull request with that App token, not with this job's GITHUB_TOKEN
    # (docs/faq.md and src/github/token.ts at the pinned commit). So:
    # - id-token: write: needed for the OIDC exchange (docs/faq.md, docs/setup.md);
    # - contents: read: actions/checkout;
    # - actions: read: the action's CI tools read workflow runs with this job's
    #   token (docs/configuration.md, src/mcp/install-mcp-server.ts).
    # If you switch to the `github_token` input instead of the Claude App, this
    # job's token does the writes and needs contents, pull-requests and issues:
    # write; add them here and to the allowlist in scripts/check-workflows.mjs.
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # The v1 tag pointed at this commit (v1.0.290) when it was pinned.
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
