# Continuous integration (backlog M0-T5). Runs every check from the Definition
# of done in CLAUDE.md on pull requests and on pushes to main.
#
# Safety rules, enforced by scripts/check-workflows.mjs (the workflow-lint job):
# - read-only token (top-level `permissions: contents: read`, nothing else);
# - every action pinned to a full commit SHA, version in a trailing comment;
# - no pull_request_target, no secrets, checkout without persisted credentials;
# - every job has timeout-minutes.
# Branch protection should require the single `ci-ok` check.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A group holds one running and one pending run; a newer run replaces the
# pending one. PR runs share a group per pull request, so superseded runs are
# cancelled. Each push gets its own group (by commit SHA), so every push to main
# runs to completion and none is dropped while pending.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  # Decides whether the change can affect the app, so the macOS `ios` job can
  # be skipped when it cannot (M0-T9). No third-party action: a plain
  # `git diff --name-only --no-renames` against the PR base (a file moved out
  # of ios/ counts as a change to ios/). Pushes to main always run ios.
  # Any doubt (unknown event, missing base, failed diff) means ios=true.
  # ios=true when a changed path starts with one of IOS_PATHS; a path ending
  # in `/` is a directory prefix.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the PR base commit is present for the diff.
          fetch-depth: 0
      - name: Paths that affect the app
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IOS_PATHS: >-
            ios/
            contracts/vocabulary/
            contracts/i18n/
            scripts/generate-ios-vocabulary.mjs
            scripts/check-ios-strings.mjs
            .github/workflows/ci.yml
        # GitHub runs this with bash -eo pipefail; every check that may fail is
        # an `if` condition, so a failed git command falls through to ios=true.
        run: |
          set -euo pipefail
          ios=true
          reason="fail-safe default"
          if [ "$EVENT_NAME" = "push" ]; then
            reason="push: always run ios"
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            reason="event $EVENT_NAME: always run ios"
          elif [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            reason="base commit ${BASE_SHA:-<none>} not available"
          elif ! list="$(mktemp)" || ! git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$list"; then
            reason="git diff failed"
          else
            ios=false
            reason="no changed path affects the app"
            # -z: NUL-separated, so no path is quoted or split.
            while IFS= read -r -d '' path; do
              [ -n "$path" ] || continue
              for prefix in $IOS_PATHS; do
                if [[ "$path" == "$prefix" ]] || [[ "$prefix" == */ && "$path" == "$prefix"* ]]; then
                  ios=true
                  reason="$path changed"
                  break 2
                fi
              done
            done < "$list"
          fi
          echo "ios=$ios ($reason)"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install (contracts, for the yaml parser)
        working-directory: contracts
        run: npm ci
      - name: Check workflow files
        run: |
          set -euo pipefail
          node --test scripts/check-workflows.test.mjs
          node scripts/check-workflows.mjs

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install
        working-directory: contracts
        run: npm ci
      - name: Test
        working-directory: contracts
        run: npm test
      - name: No free text
        run: scripts/check-no-free-text.sh
      # iOS checks that need no Mac (M0-T6): the generated Swift vocabulary
      # matches contracts/, and the String Catalog has English and German.
      - name: iOS scripts tests
        run: node --test scripts/ios-scripts.test.mjs
      - name: iOS generated vocabulary is up to date
        run: node scripts/generate-ios-vocabulary.mjs --check
      - name: iOS String Catalog is complete
        run: node scripts/check-ios-strings.mjs

  # Builds the app and runs its unit tests on the iOS Simulator (M0-T6).
  # The runner image and the Xcode version are pinned, so an upgrade is a
  # deliberate change here. Signing is off; no certificates or secrets.
  # Skipped when `changes` finds nothing that can affect the app (M0-T9).
  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      XCODE_APP: /Applications/Xcode_16.4.app
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest
      DERIVED_DATA: ${{ github.workspace }}/ios/DerivedData
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "$XCODE_APP is not on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
      - name: Available simulators
        run: xcrun simctl list devices available
      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Cupmark.xcodeproj \
            -scheme Cupmark \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project Cupmark.xcodeproj \
            -scheme Cupmark \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Generated contract is up to date
        run: npm run check:generated

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Offline: --no-lookups, no AWS credentials exist in this workflow.
      - name: Synth
        run: npm run synth

  # Every job must succeed. The one exception: `ios` may be skipped, but only
  # when `changes` succeeded and said ios=false. A failed or cancelled ios, or
  # a skip for any other reason, fails ci-ok.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, workflow-lint, contracts, ios, backend, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        env:
          CHANGES_IOS: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
          OTHER_RESULTS: >-
            changes=${{ needs.changes.result }}
            workflow-lint=${{ needs.workflow-lint.result }}
            contracts=${{ needs.contracts.result }}
            backend=${{ needs.backend.result }}
            infra=${{ needs.infra.result }}
        run: |
          set -euo pipefail
          echo "Job results: $OTHER_RESULTS ios=$IOS_RESULT (changes said ios=$CHANGES_IOS)"
          failed=0
          for pair in $OTHER_RESULTS; do
            if [ "${pair#*=}" != "success" ]; then
              echo "A required job did not succeed: $pair"
              failed=1
            fi
          done
          if [ "$IOS_RESULT" = "success" ]; then
            :
          elif [ "$IOS_RESULT" = "skipped" ] && [ "$CHANGES_IOS" = "false" ]; then
            echo "ios skipped: no changed path affects the app"
          else
            echo "ios did not succeed: $IOS_RESULT (changes said ios=$CHANGES_IOS)"
            failed=1
          fi
          exit "$failed"
