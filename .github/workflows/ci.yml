# Continuous integration (backlog M0-T5). Runs every check from the Definition
# of done in CLAUDE.md on pull requests and on pushes to main.
#
# Safety rules, enforced by scripts/check-workflows.mjs (the workflow-lint job):
# - read-only token (top-level `permissions: contents: read`, nothing else);
# - every action pinned to a full commit SHA, version in a trailing comment;
# - no pull_request_target, no secrets, checkout without persisted credentials;
# - every job has timeout-minutes.
# Branch protection should require the single `ci-ok` check.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A group holds one running and one pending run; a newer run replaces the
# pending one. PR runs share a group per pull request, so superseded runs are
# cancelled. Each push gets its own group (by commit SHA), so every push to main
# runs to completion and none is dropped while pending.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  # Decides whether the change can affect the app, so the macOS `ios` job can
  # be skipped when it cannot (M0-T9). No third-party action: a plain
  # `git diff --name-only --no-renames` (a file moved out of ios/ counts as a
  # change to ios/). A pull request is compared with its base commit; a push to
  # main with the commit the push replaced (github.event.before).
  # Any doubt (unknown event, missing or all-zero or unreachable base, failed
  # diff) means ios=true.
  # ios=true when a changed path starts with one of IOS_PATHS; a path ending
  # in `/` is a directory prefix. A Markdown file under ios/ (the README) is not
  # part of the app and is skipped. IOS_PATHS covers ios/ and everything the iOS
  # generators read: the scripts themselves, the contracts/lib modules they
  # import, and their inputs (M2-T6). scripts/check-workflows.test.mjs derives
  # that list from the scripts and fails if an entry is missing.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the base commit (PR base, or the commit before a push) is present for the diff.
          fetch-depth: 0
      - name: Paths that affect the app
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          IOS_PATHS: >-
            ios/
            contracts/vocabulary/
            contracts/i18n/
            contracts/openapi.yaml
            contracts/lib/vocabulary.mjs
            contracts/lib/lock.mjs
            contracts/lib/openapi.mjs
            scripts/generate-ios-vocabulary.mjs
            scripts/generate-ios-api.mjs
            scripts/check-ios-strings.mjs
            scripts/check-ios-accessibility.mjs
            scripts/check-ios-colours.mjs
            .github/workflows/ci.yml
        # GitHub runs this with bash -eo pipefail; every check that may fail is
        # an `if` condition, so a failed git command falls through to ios=true.
        run: |
          set -euo pipefail
          ios=true
          reason="fail-safe default"
          from=""
          to=""
          known=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            from="$BASE_SHA"
            to="HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            from="$BEFORE_SHA"
            to="$AFTER_SHA"
          else
            known=false
            reason="event $EVENT_NAME: always run ios"
          fi
          if [ "$known" != "true" ]; then
            :
          elif [ -z "${from//0/}" ] || [ -z "$to" ]; then
            # Empty, or all zeros (a push that creates the branch).
            reason="no base commit (${from:-<none>}): always run ios"
          elif ! git cat-file -e "$from^{commit}" 2>/dev/null || ! git cat-file -e "$to^{commit}" 2>/dev/null; then
            reason="base commit $from or head commit $to not available"
          elif ! list="$(mktemp)" || ! git diff --name-only --no-renames -z "$from" "$to" > "$list"; then
            reason="git diff failed"
          else
            ios=false
            reason="no changed path affects the app"
            # -z: NUL-separated, so no path is quoted or split.
            while IFS= read -r -d '' path; do
              [ -n "$path" ] || continue
              # Markdown under ios/ (the README) is not part of the app.
              if [[ "$path" == ios/* && "$path" == *.md ]]; then
                continue
              fi
              for prefix in $IOS_PATHS; do
                if [[ "$path" == "$prefix" ]] || [[ "$prefix" == */ && "$path" == "$prefix"* ]]; then
                  ios=true
                  reason="$path changed"
                  break 2
                fi
              done
            done < "$list"
          fi
          echo "ios=$ios ($reason)"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install (contracts, for the yaml parser)
        working-directory: contracts
        run: npm ci
      - name: Check workflow files
        run: |
          set -euo pipefail
          node --test scripts/check-workflows.test.mjs
          node --test scripts/deploy-gate.test.mjs
          node scripts/check-workflows.mjs

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install
        working-directory: contracts
        run: npm ci
      # Licence allowlist (M0-T10): every lockfile package against
      # scripts/licence-policy.json. Each job checks the lockfile it installed,
      # so no extra install is needed; the checker's tests run here.
      - name: Licence check tests
        run: node --test scripts/check-licences.test.mjs
      - name: Licences
        run: node scripts/check-licences.mjs contracts
      - name: Test
        working-directory: contracts
        run: npm test
      - name: No free text
        run: scripts/check-no-free-text.sh
      # iOS checks that need no Mac (M0-T6): the generated Swift vocabulary
      # matches contracts/, and the String Catalog has English and German.
      - name: iOS scripts tests
        run: node --test scripts/ios-scripts.test.mjs
      # The companion page in site/ stays static and true to the decisions (M2-T38).
      - name: Companion page tests
        run: node --test scripts/site.test.mjs
      # The reference recipe set stays numbers and vocabulary ids only (M2-T46).
      - name: Reference recipe tests
        run: node --test scripts/reference-recipes.test.mjs
      # The coffee look (M2-T41): the colour check, and the contrast of the colour sets.
      - name: iOS colour check tests
        run: node --test scripts/ios-colours.test.mjs
      - name: iOS generated vocabulary is up to date
        run: node scripts/generate-ios-vocabulary.mjs --check
      # The Swift API types match contracts/openapi.yaml (M2-T7, ADR 0022).
      - name: iOS generated API types are up to date
        run: node scripts/generate-ios-api.mjs --check
      - name: iOS String Catalog is complete
        run: node scripts/check-ios-strings.mjs
      # The hand-written project file and scheme (M2-T33): every id defined once
      # and referenced ids defined, and both test targets in the test action.
      - name: iOS project file is consistent
        run: node scripts/check-xcode-project.mjs
      # Accessibility rules readable from the source, and the UI-test start
      # compiled in Debug only (M2-T33).
      - name: iOS accessibility and Debug-only checks
        run: node scripts/check-ios-accessibility.mjs
      # The coffee look (M2-T41, ADR 0032): colours only through Theme and the named colour
      # sets, and every text and tint pairing at 4.5:1 or better in both appearances.
      - name: iOS colours are named, and contrast holds
        run: node scripts/check-ios-colours.mjs

  # Builds the app and runs its unit tests and, from M2-T33, its UI tests
  # (CupmarkUITests) on the iOS Simulator (M0-T6). Both are in the Cupmark
  # scheme's test action, which `xcodebuild test-without-building` runs, except
  # the report-only per-screen accessibility audits (class AccessibilityAuditTests,
  # which never gate): `-skip-testing:CupmarkUITests/AccessibilityAuditTests`.
  # They run weekly and on demand in ios-audits.yml. The VoiceOver value and
  # navigation UI tests (AccessibilityVoiceOverTests) and the other UI tests run here.
  # The runner image and the Xcode version are pinned, so an upgrade is a
  # deliberate change here. Signing is off; no certificates or secrets.
  # Skipped when `changes` finds nothing that can affect the app (M0-T9).
  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_16.4.app
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest
      DERIVED_DATA: ${{ github.workspace }}/ios/DerivedData
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "$XCODE_APP is not on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
      - name: Available simulators
        run: xcrun simctl list devices available
      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Cupmark.xcodeproj \
            -scheme Cupmark \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project Cupmark.xcodeproj \
            -scheme Cupmark \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -skip-testing:CupmarkUITests/AccessibilityAuditTests \
            CODE_SIGNING_ALLOWED=NO

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DynamoDB Local for the repository integration tests (M1-T3). The image is
    # pinned by digest (tag 3.3.2); its default command runs in memory. It never
    # talks to AWS and needs no credentials beyond the dummy pair in the tests.
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 127.0.0.1:8000:8000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      # Licence allowlist (M0-T10), on the lockfile installed just above.
      - name: Licences
        working-directory: .
        run: node scripts/check-licences.mjs backend
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Fails instead of skipping if DynamoDB Local is not up (REQUIRE_DYNAMODB_LOCAL).
      - name: Integration tests (DynamoDB Local)
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          REQUIRE_DYNAMODB_LOCAL: '1'
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Generated contract is up to date
        run: npm run check:generated

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            backend/package-lock.json
      # The Lambda code is the backend's bundle (backend/dist/<name>/index.mjs, M1-T2),
      # and the route test parses contracts/openapi.yaml with the backend's yaml package.
      # Licences of backend dependencies are checked in the backend job.
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Build backend bundles
        working-directory: backend
        run: npm run build
      - name: Install
        run: npm ci
      # Licence allowlist (M0-T10), on the lockfile installed just above.
      - name: Licences
        working-directory: .
        run: node scripts/check-licences.mjs infra
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Offline: --no-lookups, no AWS credentials exist in this workflow.
      - name: Synth
        run: npm run synth

  # Every job must succeed. The one exception: `ios` may be skipped, but only
  # when `changes` succeeded and said ios=false. A failed or cancelled ios, or
  # a skip for any other reason, fails ci-ok.
  # `!cancelled()` instead of `always()`: when the whole run is cancelled
  # (a newer push superseded it), ci-ok is skipped and shows grey instead of a
  # misleading red. A job that fails or times out still runs ci-ok and fails it.
  # GitHub counts a skipped required check as passing, so the lead merges only
  # when ci-ok concluded `success` on the head commit (next-task skill, step 5).
  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() }}
    needs: [changes, workflow-lint, contracts, ios, backend, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        env:
          CHANGES_IOS: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
          OTHER_RESULTS: >-
            changes=${{ needs.changes.result }}
            workflow-lint=${{ needs.workflow-lint.result }}
            contracts=${{ needs.contracts.result }}
            backend=${{ needs.backend.result }}
            infra=${{ needs.infra.result }}
        run: |
          set -euo pipefail
          echo "Job results: $OTHER_RESULTS ios=$IOS_RESULT (changes said ios=$CHANGES_IOS)"
          failed=0
          for pair in $OTHER_RESULTS; do
            if [ "${pair#*=}" != "success" ]; then
              echo "A required job did not succeed: $pair"
              failed=1
            fi
          done
          if [ "$IOS_RESULT" = "success" ]; then
            :
          elif [ "$IOS_RESULT" = "skipped" ] && [ "$CHANGES_IOS" = "false" ]; then
            echo "ios skipped: no changed path affects the app"
          else
            echo "ios did not succeed: $IOS_RESULT (changes said ios=$CHANGES_IOS)"
            failed=1
          fi
          exit "$failed"
