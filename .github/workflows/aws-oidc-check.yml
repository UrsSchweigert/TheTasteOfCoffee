# Manual check that GitHub Actions can assume the Cupmark deploy role through OIDC
# and reach only the cdk-cupmark bootstrap roles. Read-only: it creates nothing.
# Run it from main (the role trusts main and the dev environment only).
#
# Strict file in scripts/check-workflows.mjs: actions pinned to a commit SHA
# with a version comment, no token scopes at the top level, and the job grants
# only id-token: write, which configure-aws-credentials needs to fetch the
# GitHub OIDC token for AssumeRoleWithWebIdentity. The job checks out nothing,
# so it needs no contents scope.
name: AWS OIDC check
on:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: cupmark-oidc-check
      - name: Caller identity
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          echo "Assumed: $(echo "$arn" | sed -E 's/[0-9]{12}/<account>/')"
          case "$arn" in *CupmarkGitHubDeploy*) ;; *) echo "Unexpected role"; exit 1;; esac
      - name: Can assume the Cupmark CDK lookup role
        run: |
          acct="$(aws sts get-caller-identity --query Account --output text)"
          aws sts assume-role \
            --role-arn "arn:aws:iam::${acct}:role/cdk-cupmark-lookup-role-${acct}-eu-central-1" \
            --role-session-name cupmark-oidc-check --query 'AssumedRoleUser.AssumedRoleId' --output text | sed -E 's/[0-9]{12}/<account>/'
      - name: Cannot assume the shared CDK role
        run: |
          acct="$(aws sts get-caller-identity --query Account --output text)"
          if aws sts assume-role \
            --role-arn "arn:aws:iam::${acct}:role/cdk-hnb659fds-deploy-role-${acct}-eu-central-1" \
            --role-session-name cupmark-oidc-check >/dev/null 2>&1; then
            echo "Shared bootstrap role is reachable, guardrails are broken"; exit 1
          fi
          echo "Shared bootstrap role correctly denied"
